
name: Build R.T Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        shell: bash
        run: |
          test -f rt_music_github_cloud_build.zip || {
            echo "Upload rt_music_github_cloud_build.zip to the repository root first."
            exit 1
          }

          unzip -o rt_music_github_cloud_build.zip -d source

          flutter create --org com.rtmusic --project-name rt_music rt_music

          cp source/lib/main.dart rt_music/lib/main.dart
          cp source/pubspec.yaml rt_music/pubspec.yaml

          mkdir -p rt_music/assets
          cp source/assets/rt_music_icon.png rt_music/assets/

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("rt_music/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                  s,
                  count=1
              )

          s = s.replace('android:label="rt_music"', 'android:label="R.T Music"')
          p.write_text(s)
          PY

      - name: Build release APK
        working-directory: rt_music
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rt-music-android-apk
          path: rt_music/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
